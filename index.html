<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con iFrame Completo</title>
    <style>
        /* Elimina los márgenes por defecto del navegador */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita barras de scroll dobles */
        }

        /* Configura el iframe para ocupar toda la pantalla */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Elimina el borde por defecto */
            display: block; /* Elimina espacios en blanco en la base */
        }
    </style>
</head>
<body>

    <!-- Reemplaza la URL de src por la página que quieras mostrar -->
    <iframe src="https://fr.4everproxy.com/direct/aHR0cHM6Ly9xd2VuLmFpL2hvbWU-+"></iframe>

</body>
</html>
